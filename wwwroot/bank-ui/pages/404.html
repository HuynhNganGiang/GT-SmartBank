<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>404 - Không tìm thấy trang | GT SmartBank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@350;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            800: '#b60000',
                            850: '#a00000',
                            900: '#9c0000'
                        },
                        secondary: {
                            700: '#f7b500'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .error-gradient {
            background: radial-gradient(circle at 50% 50%, #00122e 0%, #00224f 50%, #000c1f 100%);
        }
    </style>
</head>
<body class="error-gradient text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="max-w-md w-full text-center space-y-8">
        
        <!-- Glassmorphism Card -->
        <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-3xl shadow-2xl relative overflow-hidden group">
            <!-- Pulsing gold background glow -->
            <div class="absolute -top-24 -left-24 w-48 h-48 bg-secondary-700/10 rounded-full blur-3xl pointer-events-none group-hover:bg-secondary-700/15 transition-all duration-500"></div>
            <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-brand-800/10 rounded-full blur-3xl pointer-events-none group-hover:bg-brand-800/15 transition-all duration-500"></div>

            <!-- Broken Connection Icon -->
            <div class="w-20 h-20 bg-white/10 border border-white/20 text-secondary-700 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-black/30">
                <i data-lucide="unplug" class="w-10 h-10 animate-bounce"></i>
            </div>

            <!-- Error Code -->
            <h1 class="text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-secondary-700 tracking-tighter leading-none mb-4 font-mono">
                404
            </h1>
            
            <h2 class="text-lg font-bold text-white mb-2">Trang không tồn tại hoặc đã bị ẩn</h2>
            
            <p class="text-xs text-slate-400 leading-relaxed font-medium mb-8">
                Đường dẫn bạn truy cập có thể đã hết hạn, bị thay đổi tên hoặc tạm thời không khả dụng trên hệ thống GT SmartBank.
            </p>

            <!-- Actions -->
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a href="/index.html" class="flex-1 py-3 px-4 bg-brand-800 hover:bg-brand-900 text-white rounded-xl text-xs font-bold uppercase tracking-wider transition-all shadow-lg shadow-brand-800/20 flex items-center justify-center gap-2">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    Về Trang chủ
                </a>
                <a href="/admin/dashboard.html" class="flex-1 py-3 px-4 bg-white/10 hover:bg-white/25 text-white border border-white/10 rounded-xl text-xs font-bold uppercase tracking-wider transition-all flex items-center justify-center gap-2">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    Vào Dashboard
                </a>
            </div>
        </div>

        <!-- System Status Bar -->
        <div class="flex items-center justify-center gap-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span>
            <span>Hệ thống hoạt động bình thường</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/config.js"></script>
    <script src="/js/public.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
