<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý khách hàng | GT Smart Bank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/bank-ui/css/style.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            150: '#eef2f6',
                            850: '#1e293b',
                            950: '#030712',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-300">

<!-- Sidebar Mobile Overlay -->
<div class="fixed inset-0 z-20 bg-slate-950/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 lg:hidden" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="sidebar fixed lg:static inset-y-0 left-0 z-30 flex flex-col justify-between w-64 md:w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 transition-all duration-300 transform -translate-x-full lg:translate-x-0" id="sidebar">
        <!-- Managed dynamically by theme.js -->
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content flex-1 p-4 md:p-6 lg:p-8 transition-all duration-300 lg:ml-0 overflow-x-hidden">

        <!-- HEADER / TOPBAR -->
        <header class="topbar flex items-center justify-between p-4 md:p-6 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border border-slate-250/50 dark:border-slate-800/60 rounded-2xl mb-6 shadow-sm sticky top-0 z-10 w-full" id="topbar">
            <!-- Managed dynamically by theme.js -->
            <div>
                <h1>Quản lý hệ thống khách hàng</h1>
                <p>Danh sách người dùng đăng ký sử dụng dịch vụ GT Smart Bank</p>
            </div>
            <div class="topbar-actions">
                <div class="user-welcome">
                    <div class="user-info">
                        <div class="name" id="userFullName">Quản trị viên</div>
                        <div class="role" id="userRole">Admin</div>
                    </div>
                </div>
                <button onclick="toggleDarkMode()" class="theme-btn">🌙 Dark Mode</button>
            </div>
        </header>

        <section class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column: Search & Customer Table -->
            <div class="lg:col-span-2 flex flex-col gap-6">
                <!-- Search Box -->
                <div class="flex flex-col sm:flex-row gap-4 p-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/85 rounded-2xl shadow-sm">
                    <div class="relative flex-1">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400 dark:text-slate-500">
                            <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        </span>
                        <input type="text" id="searchKeyword" class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-800/80 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-colors" placeholder="Tìm kiếm khách hàng theo Họ tên, Số điện thoại hoặc CCCD..." oninput="filterCustomers()">
                    </div>
                    <button class="px-5 py-3 rounded-xl font-bold text-sm bg-emerald-500 hover:bg-emerald-600 text-white shadow-lg shadow-emerald-500/25 dark:shadow-emerald-500/10 hover:shadow-emerald-500/35 transition-all duration-300 flex items-center justify-center gap-2" onclick="loadCustomers()">
                        <svg viewBox="0 0 24 24" class="w-4 h-4 fill-current"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                        <span>Tải lại</span>
                    </button>
                </div>

                <!-- Customer Table Container -->
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 rounded-2xl shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full min-w-[700px] border-collapse text-left">
                            <thead>
                                <tr class="border-b border-slate-200 dark:border-slate-800/85 bg-slate-50 dark:bg-slate-950/20 text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
                                    <th class="px-6 py-4">Mã KH</th>
                                    <th class="px-6 py-4">Họ tên</th>
                                    <th class="px-6 py-4">Số điện thoại / CCCD</th>
                                    <th class="px-6 py-4">Email / Địa chỉ</th>
                                    <th class="px-6 py-4">Vai trò</th>
                                    <th class="px-6 py-4">Trạng thái</th>
                                    <th class="px-6 py-4 text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="khachHangBody" class="divide-y divide-slate-150 dark:divide-slate-800/60 text-sm">
                                <tr>
                                    <td colspan="7" class="px-6 py-8 text-center text-slate-450 italic">Đang tải danh sách...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Right Column: Admin Form Box -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 rounded-3xl p-6 shadow-sm hover:shadow transition-all duration-300 h-fit">
                <div class="flex items-center gap-2 mb-4">
                    <span class="inline-block w-1.5 h-6 bg-emerald-500 rounded-full"></span>
                    <h2 id="formTitle" class="text-lg font-bold text-slate-800 dark:text-white">Thêm khách hàng mới</h2>
                </div>
                
                <hr class="border-slate-100 dark:border-slate-850 mb-6">
                
                <input type="hidden" id="editCustomerId" value="">

                <div class="flex flex-col gap-5">
                    <div class="flex flex-col gap-1.5">
                        <label for="customerName" class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Họ và tên</label>
                        <input type="text" id="customerName" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-850 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-colors text-slate-800 dark:text-slate-100" placeholder="VD: Nguyễn Văn A" required>
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="customerCccd" class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Số CCCD (12 số)</label>
                        <input type="text" id="customerCccd" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-850 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-colors text-slate-800 dark:text-slate-100" placeholder="VD: 034201001234" required>
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="customerPhone" class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Số điện thoại (Tên đăng nhập)</label>
                        <input type="text" id="customerPhone" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-850 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-colors text-slate-800 dark:text-slate-100" placeholder="VD: 0987654321" required>
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="customerEmail" class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Địa chỉ Email</label>
                        <input type="email" id="customerEmail" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-850 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-colors text-slate-800 dark:text-slate-100" placeholder="VD: name@example.com">
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="customerAddress" class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Địa chỉ thường trú</label>
                        <input type="text" id="customerAddress" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-850 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-colors text-slate-800 dark:text-slate-100" placeholder="VD: Quận 1, TP. Hồ Chí Minh">
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="customerPassword" id="passwordLabel" class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Mật khẩu đăng nhập</label>
                        <input type="password" id="customerPassword" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-850 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-colors text-slate-800 dark:text-slate-100" placeholder="Nhập mật khẩu cho khách hàng">
                        <span id="passwordHelp" class="text-[10px] text-slate-450 dark:text-slate-500 font-medium hidden">* Bỏ trống nếu muốn giữ nguyên mật khẩu cũ</span>
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="customerRole" class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Phân quyền vai trò</label>
                        <select id="customerRole" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-850 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-colors text-slate-800 dark:text-slate-100">
                            <option value="User" selected>User (Khách hàng)</option>
                            <option value="Admin">Admin (Quản trị viên)</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="customerStatus" class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Trạng thái tài khoản</label>
                        <select id="customerStatus" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-850 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-colors text-slate-800 dark:text-slate-100">
                            <option value="true" selected>Hoạt động (Active)</option>
                            <option value="false">Tạm khóa (Locked)</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-2.5 mt-2">
                        <button id="btnSubmitCustomer" class="w-full py-3.5 rounded-xl font-bold text-sm bg-emerald-500 hover:bg-emerald-600 text-white shadow-lg shadow-emerald-500/20 hover:shadow-emerald-500/35 transition-all duration-300 flex items-center justify-center gap-2" onclick="saveCustomer()">
                            Thêm khách hàng
                        </button>
                        
                        <button id="btnCancelEdit" class="w-full py-3.5 rounded-xl font-bold text-sm bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-350 hover:bg-slate-200 dark:hover:bg-slate-750 transition-colors hidden" onclick="cancelEdit()">
                            Hủy chỉnh sửa
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </main>

</div>

<script src="/bank-ui/js/api.js"></script>
<script src="/bank-ui/js/theme.js"></script>
<script>
    // Kiểm tra bảo mật và quyền truy cập trước khi render giao diện
    const token = localStorage.getItem("token");
    const userStr = localStorage.getItem("user");
    let user = null;
    
    if (userStr) {
        try {
            user = JSON.parse(userStr);
        } catch(e) {}
    }

    if (!token || !user) {
        window.location.href = "/bank-ui/pages/login.html";
    } else if (user && user.role !== "Admin") {
        // Chặn người dùng thường truy cập trang quản lý khách hàng
        if (typeof showToast === "function") {
            showToast("Bạn không có quyền truy cập trang này!", "error");
        } else {
            alert("Bạn không có quyền truy cập trang này!");
        }
        setTimeout(() => {
            window.location.href = "/bank-ui/index.html";
        }, 1500);
    }
</script>
<script>
    // Điền thông tin người dùng lên Header
    document.addEventListener("DOMContentLoaded", () => {
        const u = getCurrentUser();
        if (u) {
            const userFullNameEl = document.getElementById("userFullName");
            const userRoleEl = document.getElementById("userRole");
            if (userFullNameEl) userFullNameEl.innerText = u.hoTen;
            if (userRoleEl) userRoleEl.innerText = u.role === "Admin" ? "Quản trị viên" : "Khách hàng";
        }
    });

    function logout() {
        removeToken();
        removeCurrentUser();
        localStorage.removeItem("refreshToken");
        window.location.href = "/bank-ui/pages/login.html";
    }
</script>
<script src="/bank-ui/js/khachhang.js"></script>

</body>
</html>
