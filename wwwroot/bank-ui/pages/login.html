<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập — Cổng Ngân hàng số GT SmartBank</title>
    <meta name="description" content="GT SmartBank — Cổng đăng nhập ngân hàng số Internet Banking an toàn và bảo mật.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                        800: '#01479D',
                        850: '#01479D',
                        900: '#003A80',
                    },
               secondary: {
                    700: '#1BC3CC',
                 }
                    }
                }
            }
        };
    </script>
    <style>
    .login-bg {
        background:
            linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.15)),
            url('/bank-ui/assets/login/phanthiet-login.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        min-height: 100vh;
    }

    .login-card {
        background: rgba(255, 255, 255, 0.90);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 28px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.22);
    }

    .login-logo {
        height: 64px;
        width: auto;
        object-fit: contain;
    }

    .login-input {
        background: rgba(245, 249, 255, 0.92);
        border: 1px solid #dbe3f0;
    }

    .login-input:focus {
        border-color: #01479D;
        box-shadow: 0 0 0 4px rgba(1, 71, 157, 0.14);
    }

    .login-btn {
        background: #01479D;
        box-shadow: 0 12px 24px rgba(1, 71, 157, 0.28);
    }

    .login-btn:hover {
        background: #003A80;
        transform: translateY(-2px);
        box-shadow: 0 16px 30px rgba(1, 71, 157, 0.35);
    }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center p-4">

    <!-- Login Card -->
    <div class="login-card w-full max-w-md p-8 relative border border-white/30 z-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <a href="/bank-ui/index.html" class="inline-flex justify-center mb-6">
    <img src="/bank-ui/assets/login/logo-gt-blue.png"
         alt="GT SmartBank"
         class="login-logo">
</a>
            <h2 class="text-xl font-bold text-slate-800">Cổng Ngân hàng số</h2>
            <p class="text-xs text-slate-400 mt-1 font-semibold">INTERNET BANKING PORTAL</p>
        </div>

        <!-- Error Msg Container -->
        <div id="errorMsg" class="hidden bg-rose-50 border-l-4 border-brand-800 text-brand-800 p-4 rounded-xl text-xs font-bold mb-6"></div>

        <!-- Form Inputs -->
        <div class="space-y-5 text-xs font-semibold text-slate-500">
            <div class="flex flex-col gap-1.5">
                <label for="soDienThoai" class="uppercase tracking-wider">Số điện thoại đăng ký</label>
                <input type="text" id="soDienThoai" placeholder="Nhập số điện thoại" required autofocus autocomplete="username"
                       class="login-input w-full rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 outline-none transition-all font-bold">
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="matKhau" class="uppercase tracking-wider">Mật khẩu bảo mật</label>
                <input type="password" id="matKhau" placeholder="Nhập mật khẩu" required autocomplete="current-password"
                       class="login-input w-full rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 outline-none transition-all font-bold">
            </div>

            <div class="flex items-center justify-between font-bold pt-1">
                <a href="#" onclick="alert('Vui lòng liên hệ quầy giao dịch gần nhất hoặc gọi Hotline 1800 9999 để cấp lại mật khẩu.'); return false;" class="text-brand-800 hover:text-brand-900 transition-colors">Quên mật khẩu?</a>
                <a href="/bank-ui/index.html" class="text-slate-400 hover:text-slate-600 transition-colors flex items-center gap-1">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    Quay lại trang chủ
                </a>
            </div>

            <button id="loginBtn" onclick="login()" class="login-btn w-full py-3.5 text-white rounded-xl text-xs font-extrabold uppercase tracking-widest transition-all">
                Đăng nhập hệ thống
            </button>
        </div>

    </div>

    <!-- Scripts -->
   <script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
