<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chuyển tiền | GT Smart Bank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/bank-ui/css/style.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            150: '#eef2f6',
                            850: '#1e293b',
                            950: '#030712',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-300">

<!-- Sidebar Mobile Overlay -->
<div class="fixed inset-0 z-20 bg-slate-950/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 lg:hidden" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="sidebar fixed lg:static inset-y-0 left-0 z-30 flex flex-col justify-between w-64 md:w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 transition-all duration-300 transform -translate-x-full lg:translate-x-0" id="sidebar">
        <!-- Managed dynamically by theme.js -->
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content flex-1 p-4 md:p-6 lg:p-8 transition-all duration-300 lg:ml-0 overflow-x-hidden">

        <!-- HEADER / TOPBAR -->
        <header class="topbar flex items-center justify-between p-4 md:p-6 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border border-slate-250/50 dark:border-slate-800/60 rounded-2xl mb-6 shadow-sm sticky top-0 z-10 w-full" id="topbar">
            <!-- Managed dynamically by theme.js -->
        </header>

        <!-- TRANSFER CONTAINER FORM -->
        <div class="max-w-2xl mx-auto">
            <section class="p-6 md:p-8 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 rounded-3xl shadow-sm hover:shadow transition-all duration-300">
                <h2 class="text-xl font-bold text-slate-800 dark:text-white mb-6 flex items-center gap-2.5">
                    <span class="inline-block w-1.5 h-6 bg-emerald-500 rounded-full"></span>
                    Thông tin chuyển khoản
                </h2>

                <div class="space-y-6">
                    <!-- Tài khoản nguồn -->
                    <div class="form-group flex flex-col gap-1.5">
                        <label for="tkNguon" class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Tài khoản nguồn</label>
                        <select id="tkNguon" onchange="updateBalanceInfo()" 
                                class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15 rounded-xl px-4 py-3.5 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-450 outline-none transition-all font-semibold">
                            <option value="">-- Chọn tài khoản thanh toán --</option>
                        </select>
                        <p id="tkNguonBalance" class="text-xs font-bold text-slate-500 dark:text-slate-400 mt-1 flex items-center gap-1.5"></p>
                    </div>

                    <!-- Tài khoản nhận -->
                    <div class="form-group flex flex-col gap-1.5">
                        <label for="tkDich" class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Tài khoản nhận</label>
                        <div class="flex gap-2">
                            <input type="text" id="tkDich" placeholder="Nhập số tài khoản thụ hưởng" oninput="hideDestName()"
                                   class="flex-1 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15 rounded-xl px-4 py-3.5 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-450 outline-none transition-all font-mono font-bold tracking-wider">
                            <button class="px-5 py-3.5 rounded-xl font-bold text-sm bg-emerald-500 hover:bg-emerald-600 text-white shadow-lg shadow-emerald-500/10 hover:shadow-emerald-500/25 transition-all duration-300" onclick="checkDestAccount()">Kiểm tra</button>
                        </div>
                        <div id="destNameBox" class="hidden text-xs font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-250 dark:border-emerald-800/60 rounded-xl px-4 py-3 mt-1.5"></div>
                    </div>

                    <!-- Số tiền chuyển -->
                    <div class="form-group flex flex-col gap-1.5">
                        <label for="soTien" class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Số tiền chuyển (VND)</label>
                        <input type="number" id="soTien" placeholder="Nhập số tiền chuyển (tối thiểu 10,000 VND)" min="10000" oninput="formatTienWord()"
                               class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15 rounded-xl px-4 py-3.5 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-450 outline-none transition-all font-bold">
                        <p id="soTienChu" class="text-xs font-bold text-emerald-600 dark:text-emerald-400 mt-1 italic"></p>
                    </div>

                    <!-- Nội dung chuyển khoản -->
                    <div class="form-group flex flex-col gap-1.5">
                        <label for="noiDung" class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Nội dung chuyển khoản</label>
                        <textarea id="noiDung" placeholder="Nhập nội dung chuyển tiền không dấu (VD: NGUYEN VAN A CHUYEN TIEN)" rows="3"
                                  class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15 rounded-xl px-4 py-3 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-450 outline-none transition-all font-semibold"></textarea>
                    </div>

                    <button id="btnGetOtp" class="w-full py-4 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-bold text-sm shadow-lg shadow-amber-500/20 hover:shadow-amber-500/30 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300" onclick="getOtpCode()">
                        Nhận mã xác thực OTP
                    </button>

                    <!-- OTP input box -->
                    <div id="otpContainer" class="hidden border-2 border-dashed border-emerald-500/40 dark:border-emerald-400/40 rounded-2xl p-5 bg-emerald-50/50 dark:bg-slate-950/40 space-y-4">
                        <div class="bg-amber-500/10 border-l-4 border-amber-500 text-amber-650 dark:text-amber-300 p-4 rounded-xl text-xs font-semibold leading-relaxed space-y-1">
                            <div class="flex items-center gap-1.5 font-bold">
                                <svg viewBox="0 0 24 24" class="w-4 h-4 fill-current"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                                <span>Bản thử nghiệm:</span>
                            </div>
                            <p>Hệ thống đã tự động tạo mã OTP: <span id="otpCodeShow" class="font-extrabold text-sm text-emerald-600 dark:text-emerald-400 bg-slate-100 dark:bg-slate-850 px-2 py-0.5 rounded font-mono">XXXXXX</span></p>
                            <p>Mã OTP có hiệu lực trong vòng <span id="countdownTimer" class="countdown text-rose-500 dark:text-rose-450 font-bold font-mono">180</span> giây.</p>
                        </div>

                        <div class="form-group flex flex-col gap-1.5">
                            <label for="maOtp" class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider text-center">Mã xác thực OTP</label>
                            <input type="text" id="maOtp" placeholder="Nhập 6 chữ số OTP" maxlength="6" 
                                   class="w-full max-w-[240px] mx-auto bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15 rounded-xl px-4 py-3.5 text-center text-xl font-bold tracking-[0.4em] text-slate-800 dark:text-white placeholder-slate-400 outline-none transition-all">
                        </div>

                        <button id="btnConfirmTransfer" class="w-full py-4 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-bold text-sm shadow-lg shadow-emerald-500/20 hover:shadow-emerald-500/30 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300" onclick="confirmTransfer()">
                            Xác nhận chuyển khoản
                        </button>
                    </div>

                </div>
            </section>
        </div>

    </main>

</div>

<script src="/bank-ui/js/api.js"></script>
<script src="/bank-ui/js/theme.js"></script>
<script>
    // Kiểm tra đăng nhập
    const user = getCurrentUser();
    if (!user) {
        window.location.href = "/bank-ui/pages/login.html";
    }

    function logout() {
        removeToken();
        removeCurrentUser();
        localStorage.removeItem("refreshToken");
        window.location.href = "/bank-ui/pages/login.html";
    }

    if (user && user.role !== "Admin") {
        const navCustomers = document.getElementById("navCustomers");
        if (navCustomers) navCustomers.style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", () => {
        if (user) {
            const userFullNameEl = document.getElementById("userFullName");
            const userRoleEl = document.getElementById("userRole");
            if (userFullNameEl) userFullNameEl.innerText = user.hoTen;
            if (userRoleEl) userRoleEl.innerText = user.role === "Admin" ? "Quản trị viên" : "Khách hàng";
        }
    });
</script>
<script src="/bank-ui/js/chuyentien.js"></script>

</body>
</html>
