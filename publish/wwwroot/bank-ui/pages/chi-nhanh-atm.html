<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mạng lưới Chi nhánh & ATM | GT SmartBank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            150: '#eef2f6',
                            850: '#1e293b',
                            950: '#030712',
                        }
                    }
                }
            }
        }
    </script>
    <!-- LeafletJS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <style>
        /* Custom styles to override Leaflet default design for premium appearance */
        .leaflet-popup-content-wrapper {
            background: #ffffff !important;
            color: #1e293b !important;
            border-radius: 18px !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
            border: 1px solid rgba(226, 232, 240, 0.8) !important;
            font-family: 'Outfit', sans-serif !important;
            padding: 2px !important;
        }
        .dark .leaflet-popup-content-wrapper {
            background: #0f172a !important; /* slate-900 */
            color: #f1f5f9 !important;
            border: 1px solid rgba(30, 41, 59, 0.8) !important; /* slate-800 */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2) !important;
        }
        .leaflet-popup-tip {
            background: #ffffff !important;
            border: 1px solid rgba(226, 232, 240, 0.8) !important;
        }
        .dark .leaflet-popup-tip {
            background: #0f172a !important;
            border: 1px solid rgba(30, 41, 59, 0.8) !important;
        }
        .leaflet-popup-content {
            margin: 12px 16px !important;
            line-height: 1.5 !important;
            font-size: 13px !important;
        }
        .leaflet-popup-close-button {
            color: #94a3b8 !important;
            padding: 8px 10px 0 0 !important;
        }
        .leaflet-popup-close-button:hover {
            color: #ef4444 !important;
        }
        
        /* Smooth zoom control transition */
        .leaflet-bar {
            border: none !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important;
        }
        .leaflet-bar a {
            background-color: #ffffff !important;
            color: #1e293b !important;
            border-bottom: 1px solid #f1f5f9 !important;
            transition: all 0.2s ease;
        }
        .leaflet-bar a:hover {
            background-color: #f8fafc !important;
            color: #b60000 !important;
        }
        .dark .leaflet-bar a {
            background-color: #1e293b !important;
            color: #f1f5f9 !important;
            border-bottom: 1px solid #334155 !important;
        }
        .dark .leaflet-bar a:hover {
            background-color: #334155 !important;
            color: #f7b500 !important;
        }
        
        /* Custom scrollbar for sidebar list */
        #locationList::-webkit-scrollbar {
            width: 6px;
        }
        #locationList::-webkit-scrollbar-track {
            background: transparent;
        }
        #locationList::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark #locationList::-webkit-scrollbar-thumb {
            background: #475569;
        }
        #locationList::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .dark #locationList::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-300">

<!-- Sidebar Mobile Overlay -->
<div class="fixed inset-0 z-20 bg-slate-950/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 lg:hidden" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="sidebar fixed lg:static inset-y-0 left-0 z-30 flex flex-col justify-between w-64 md:w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 transition-all duration-300 transform -translate-x-full lg:translate-x-0" id="sidebar">
        <!-- Managed dynamically by theme.js -->
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content flex-1 p-4 md:p-6 lg:p-8 transition-all duration-300 lg:ml-0 overflow-x-hidden">

        <!-- HEADER / TOPBAR -->
        <header class="topbar flex items-center justify-between p-4 md:p-6 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border border-slate-250/50 dark:border-slate-800/60 rounded-2xl mb-6 shadow-sm sticky top-0 z-10 w-full" id="topbar">
            <!-- Managed dynamically by theme.js -->
            <div>
                <h1>Mạng lưới Chi nhánh & ATM</h1>
                <p>Tìm kiếm các điểm giao dịch và cây ATM gần nhất của GT SmartBank</p>
            </div>
            
            <div class="topbar-actions flex items-center gap-4">
                <button onclick="toggleDarkMode()" class="theme-btn flex items-center gap-2 px-3 py-2 text-xs font-bold rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-850 text-slate-700 dark:text-slate-350 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                    🌙 Tối màu
                </button>
            </div>
        </header>

        <!-- LAYOUT SECTION -->
        <section class="max-w-[1400px] mx-auto">
            <div class="grid grid-cols-1 lg:grid-cols-[400px_1fr] gap-6">
                
                <!-- Left panel: Search & Listing -->
                <div class="flex flex-col gap-4 h-[600px] lg:h-[680px]">
                    
                    <!-- Search and Filters Box -->
                    <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800/85 shadow-sm flex flex-col gap-4">
                        <h2 class="text-rose-700 dark:text-amber-400 font-extrabold text-lg flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" /></svg>
                            Tìm kiếm địa điểm
                        </h2>
                        
                        <!-- Search Box -->
                        <div class="relative">
                            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Tìm theo tên, địa chỉ, tỉnh thành..." class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-850 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-rose-500 transition-all text-slate-850 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" />
                            <span class="absolute left-3.5 top-3.5 text-slate-400 dark:text-slate-550">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.602 10.602Z" /></svg>
                            </span>
                        </div>
                        
                        <!-- Tabs / Filter buttons -->
                        <div class="flex gap-2 p-1 bg-slate-100 dark:bg-slate-950/60 rounded-xl">
                            <button id="btnFilterAll" onclick="setFilter('all')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-white dark:bg-slate-850 text-rose-700 dark:text-amber-400 shadow-sm border border-slate-200/50 dark:border-slate-800/40">
                                Tất cả
                            </button>
                            <button id="btnFilterBranch" onclick="setFilter('Branch')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">
                                Chi nhánh
                            </button>
                            <button id="btnFilterATM" onclick="setFilter('ATM')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">
                                ATM
                            </button>
                        </div>
                    </div>
                    
                    <!-- Result List Box -->
                    <div id="locationList" class="flex-1 overflow-y-auto bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800/85 shadow-sm flex flex-col gap-3">
                        <p class="text-slate-500 dark:text-slate-400 italic text-center py-4">Đang tải danh sách địa điểm...</p>
                    </div>
                    
                </div>
                
                <!-- Right panel: Leaflet Map -->
                <div class="relative bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800/85 shadow-sm overflow-hidden h-[500px] lg:h-[680px] z-0">
                    <div id="map" class="w-full h-full"></div>
                </div>
                
            </div>
        </section>

    </main>

</div>

<!-- LeafletJS JS Library -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script>
    // Security and login verification (common to portal view)
    const user = getCurrentUser();
    if (!user) {
        window.location.href = "/bank-ui/pages/login.html";
    }
</script>
<script src="../js/chi-nhanh-atm.js"></script>

</body>
</html>
