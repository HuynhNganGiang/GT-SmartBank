<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mạng lưới chi nhánh | GT Smart Bank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            150: '#eef2f6',
                            850: '#1e293b',
                            950: '#030712',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Tương thích ngược với JS toggling class full-width */
        #branchLayout.full-width {
            grid-template-columns: 1fr !important;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-300">

<!-- Sidebar Mobile Overlay -->
<div class="fixed inset-0 z-20 bg-slate-950/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 lg:hidden" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="sidebar fixed lg:static inset-y-0 left-0 z-30 flex flex-col justify-between w-64 md:w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 transition-all duration-300 transform -translate-x-full lg:translate-x-0" id="sidebar">
        <!-- Managed dynamically by theme.js -->
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content flex-1 p-4 md:p-6 lg:p-8 transition-all duration-300 lg:ml-0 overflow-x-hidden">

        <!-- HEADER / TOPBAR -->
        <header class="topbar flex items-center justify-between p-4 md:p-6 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border border-slate-250/50 dark:border-slate-800/60 rounded-2xl mb-6 shadow-sm sticky top-0 z-10 w-full" id="topbar">
            <!-- Managed dynamically by theme.js -->
            <div>
                <h1>Mạng lưới chi nhánh & PGD</h1>
                <p>Hệ thống phòng giao dịch và ATM của GT Smart Bank trên toàn quốc</p>
            </div>

            <div class="topbar-actions flex items-center gap-4">
                <div class="user-welcome hidden sm:flex items-center gap-3">
                    <div class="user-info text-right">
                        <div class="name font-bold text-sm text-slate-800 dark:text-slate-100" id="userFullName">Đang tải...</div>
                        <div class="role text-xs text-slate-500 dark:text-slate-450 font-bold" id="userRole">...</div>
                    </div>
                </div>

                <button onclick="toggleDarkMode()" class="theme-btn flex items-center gap-2 px-3 py-2 text-xs font-bold rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-850 text-slate-700 dark:text-slate-350 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                    🌙 Dark Mode
                </button>
            </div>
        </header>

        <!-- LAYOUT SECTION -->
        <section id="branchLayout" class="max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-[1.2fr_0.8fr] gap-6 transition-all duration-300">
            <!-- Left: Branch Grid -->
            <div class="flex flex-col gap-4">
                <div class="flex items-center justify-between gap-4 p-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/85 rounded-2xl shadow-sm">
                    <h2 class="text-emerald-700 dark:text-amber-400 font-extrabold text-lg flex items-center gap-2">
                        Danh sách chi nhánh hoạt động
                    </h2>
                    <button class="px-4 py-2 text-xs font-bold rounded-xl border border-slate-200 dark:border-slate-750 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-750 hover:shadow-sm transition-all" onclick="loadBranches()">
                        🔄 Tải lại
                    </button>
                </div>
                
                <div id="branchGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    <p class="text-slate-500 dark:text-slate-400 italic py-4">Đang tải danh sách chi nhánh...</p>
                </div>
            </div>

            <!-- Right: Admin Manage Form (Hidden by default, shown for Admin only) -->
            <div id="adminFormBox" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 p-6 rounded-2xl shadow-md h-fit flex flex-col gap-4" style="display: none;">
                <h2 id="formTitle" class="text-emerald-700 dark:text-amber-400 text-lg font-bold">Thêm chi nhánh mới</h2>
                <hr class="border-slate-100 dark:border-slate-800/60">
                
                <input type="hidden" id="editBranchId" value="">

                <div class="flex flex-col gap-2">
                    <label for="branchName" class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Tên chi nhánh / PGD</label>
                    <input type="text" id="branchName" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-850 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-colors text-slate-800 dark:text-slate-100" placeholder="VD: Chi nhánh Bình Thuận" required>
                </div>

                <div class="flex flex-col gap-2">
                    <label for="branchAddress" class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Địa chỉ chi tiết</label>
                    <input type="text" id="branchAddress" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-850 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-colors text-slate-800 dark:text-slate-100" placeholder="VD: 123 Trần Hưng Đạo, Phan Thiết" required>
                </div>

                <div class="flex flex-col gap-2">
                    <label for="branchPhone" class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Số điện thoại liên hệ</label>
                    <input type="text" id="branchPhone" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-850 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-colors text-slate-800 dark:text-slate-100" placeholder="VD: 0252.3821821" required>
                </div>

                <div class="flex flex-col gap-2.5 mt-2">
                    <button id="btnSubmitBranch" class="w-full py-3 px-4 rounded-xl font-bold text-sm bg-emerald-500 hover:bg-emerald-600 text-white shadow-lg shadow-emerald-500/25 dark:shadow-emerald-500/10 hover:shadow-emerald-500/35 transition-all duration-300" onclick="saveBranch()">
                        Thêm mới chi nhánh
                    </button>
                    
                    <button id="btnCancelEdit" class="w-full py-3 px-4 rounded-xl font-bold text-sm bg-slate-150 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-750 text-slate-700 dark:text-slate-300 transition-all duration-300" onclick="cancelEdit()" style="display: none;">
                        Hủy chỉnh sửa
                    </button>
                </div>
            </div>
        </section>

    </main>

</div>

<script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
<script src="/js/theme.js"></script>
<script>
    // Kiểm tra đăng nhập
    const user = getCurrentUser();
    if (!user) {
        window.location.href = "/pages/login.html";
    }

    function logout() {
        removeToken();
        removeCurrentUser();
        localStorage.removeItem("refreshToken");
        window.location.href = "/pages/login.html";
    }

    if (user && user.role !== "Admin") {
        const navCustomers = document.getElementById("navCustomers");
        if (navCustomers) navCustomers.style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", () => {
        if (user) {
            const userFullNameEl = document.getElementById("userFullName");
            const userRoleEl = document.getElementById("userRole");
            if (userFullNameEl) userFullNameEl.innerText = user.hoTen;
            if (userRoleEl) userRoleEl.innerText = user.role === "Admin" ? "Quản trị viên" : "Khách hàng";
        }
    });
</script>
<script src="/js/chinhanh.js"></script>

</body>
</html>
